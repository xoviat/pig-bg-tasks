# pig-bg-tasks — single-crate Rust extension (was a 6-crate workspace;
# collapsed 2026-10-25 for compile speed per maintainer directive — see
# RUST-PLAN §5 amendment). The pig factory `pub fn new_extension()` is the
# only entry point; pig resolves the staged SDK at cell-build time.
[workspace]
resolver = "2"

[package]
name = "pig-bg-tasks"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"
# E9 pin: exact version, no ranges.
mxc-sdk = "1.0.1"
getrandom = "0.4"
dunce = "1"
# Pig resolves this dependency to the version-matched staged SDK at build
# time (E7-verified; `PIG_SDK_RS_ROOT` / the staged SDK under the active
# config root). It is NOT on crates.io — plain cargo cannot resolve this
# package; pig owns the build (generated runner, runtime cell), so there is
# deliberately no [patch] here (a relative patch would break in pig's cell
# cache copy). The machine-local plain-cargo override lives in
# `.cargo/config.toml` (absolute path required).
pig-sdk = "0.1.0"

# Windows-only: job-object tree kills + CREATE_NO_WINDOW. Everything else
# (incl. mxc-sdk — its own windows deps are target-gated upstream) builds on
# any platform: on Unix the confined path goes through mxc's native backend
# (Bubblewrap on Linux, Seatbelt on macOS) and the bare path kills the whole
# process group via libc.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Unix-only: whole-tree kill for the bare backend (kill(-pgid)).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
